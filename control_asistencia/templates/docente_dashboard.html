{% extends "control_asistencia/base.html" %}

{% block contenido %}

<!--Archivo: docente_dashboard.html-->

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
    :root {
        --ink: #1C3829;
        --moss: #3E7A5A;
        --moss-deep: #2B5A40;
        --moss-soft: #EAF2EB;
        --gold: #BE8A2E;
        --gold-soft: #F6E8C9;
        --paper: #FBFAF6;
        --line: #DCE6DC;
        --muted: #5B6D62;
    }

    .db-wrap * { box-sizing: border-box; }

    .db-wrap {
        font-family: 'Inter', sans-serif;
        color: var(--ink);
    }

    .welcome-band {
        background: var(--ink);
        color: #ffffff;
        border-radius: 8px 40px 8px 40px;
        padding: 36px 40px;
        margin-bottom: 32px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 22px;
        flex-wrap: wrap;
    }

    .welcome-band .rings {
        position: absolute;
        right: -60px;
        top: -80px;
        width: 240px;
        height: 240px;
        opacity: 0.9;
        pointer-events: none;
    }

    .rings circle {
        fill: none;
        stroke: rgba(246, 232, 201, 0.22);
        stroke-width: 1;
    }

    .rings circle.grow {
        stroke: var(--gold);
        stroke-width: 1.3;
        stroke-dasharray: 6 10;
        transform-origin: center;
        animation: spin 70s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .welcome-mark {
        width: 52px;
        height: 52px;
        min-width: 52px;
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
    }

    .welcome-mark svg { width: 24px; height: 24px; }

    .welcome-eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold-soft);
        font-weight: 600;
        position: relative;
        z-index: 1;
    }

    .welcome-title {
        font-family: 'Fraunces', serif;
        font-size: 26px;
        font-weight: 600;
        margin: 8px 0 6px;
        position: relative;
        z-index: 1;
    }

    .welcome-copy {
        font-size: 14.5px;
        color: rgba(255,255,255,0.72);
        max-width: 440px;
        line-height: 1.6;
        position: relative;
        z-index: 1;
    }

    .stats-box {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
    }

    .stat-card {
        flex: 1;
        min-width: 220px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 4px 20px 4px 20px;
        padding: 22px 22px 20px;
        position: relative;
        transition: border-color 0.25s ease, transform 0.25s ease;
    }

    .stat-card::before {
        content: "";
        position: absolute;
        left: 0; top: 18px; bottom: 18px;
        width: 3px;
        background: var(--gold);
        border-radius: 3px;
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .stat-card:hover {
        border-color: var(--moss);
        transform: translateY(-3px);
    }

    .stat-card:hover::before { opacity: 1; }

    .stat-icon {
        width: 38px;
        height: 38px;
        color: var(--moss-deep);
        margin-bottom: 14px;
    }

    .stat-icon svg { width: 100%; height: 100%; }

    .stat-number {
        font-family: 'JetBrains Mono', monospace;
        font-size: 30px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1;
        margin-bottom: 8px;
    }

    .stat-label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    @media (max-width: 700px) {
        .welcome-band { padding: 26px 24px; }
    }
</style>

<div class="db-wrap">

    <!-- === BANDA DE BIENVENIDA === -->
    <div class="welcome-band">
        <svg class="rings" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <circle cx="120" cy="120" r="55" />
            <circle cx="120" cy="120" r="88" />
            <circle cx="120" cy="120" r="115" class="grow" />
        </svg>

        <div class="welcome-mark">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" stroke="#F6E8C9" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M6.5 10v5c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-5" stroke="#F6E8C9" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
        </div>

        <div>
            <span class="welcome-eyebrow">Panel del docente</span>
            <h1 class="welcome-title">Bienvenido, {{ request.user.username }}</h1>
            <p class="welcome-copy">
                Este es tu espacio personal para consultar y gestionar tu asistencia.
            </p>
        </div>
    </div>

    <!-- === TARJETAS ESTADÍSTICAS DEL DOCENTE === -->
    <div class="stats-box">

        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="4.5" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M9 4.5V3.8c0-.7.6-1.3 1.3-1.3h3.4c.7 0 1.3.6 1.3 1.3v.7" stroke="currentColor" stroke-width="1.4"/>
                    <path d="m8.5 13 2 2 4.5-4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="stat-number">{{ asistencias_docente }}</div>
            <div class="stat-label">Mis asistencias</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M3.5 9.5h17" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M8 3v3.5M16 3v3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="stat-number">{{ semestres_activos }}</div>
            <div class="stat-label">Semestres activos</div>
        </div>

    </div>

</div>

{% endblock %}
