<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌿</text></svg>">
<title>{% block titulo %}Asistencia Docente{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    :root {
        --primary: #40916c;     /* Verde suave */
        --primary-dark: #2d6a4f;
        --bg: #e9f5ee;          /* Fondo verde muy suave */
        --card: #ffffff;
        --text-dark: #1b4332;
        --sidebar-width: 220px;
    }

    html, body {
        height: 100%;
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text-dark);
    }

    /* SIDEBAR */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: var(--sidebar-width);
        background: var(--primary-dark);
        padding-top: 60px; 
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 4px 0px 12px rgba(0,0,0,0.12);
        z-index: 1000;
    }

    .sidebar a {
        color: #ecfdf5;
        padding: 12px 20px;
        text-decoration: none;
        font-weight: 600;
        border-left: 4px solid transparent;
        transition: 0.25s;
        border-radius: 4px;
        margin: 0 10px;
    }

    .sidebar a:hover {
        background: rgba(255,255,255,0.08);
        border-left: 4px solid #95d5b2;
    }

    /* HEADER */
    header {
        position: fixed;
        top: 0;
        left: var(--sidebar-width);
        right: 0;
        height: 60px;
        background: var(--primary);
        color: white;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-size: 1.3rem;
        font-weight: 700;
        box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        z-index: 999;
    }

    /* CONTENIDO PRINCIPAL */
    .contenedor {
        margin-left: var(--sidebar-width);
        margin-top: 85px;
        max-width: 1100px;
        padding: 32px;
        background: var(--card);
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.10);
        margin-bottom: 40px;
    }

    /* TARJETAS */
    .tarjeta {
        flex: 1 1 220px;
        background: #f9fffb;
        padding: 22px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        transition: transform 0.25s, box-shadow 0.25s;
    }

    .tarjeta:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    footer {
        text-align: center;
        color: #52796f;
        padding: 18px;
        font-size: 0.9rem;
        margin-left: var(--sidebar-width);
        margin-bottom: 18px;
    }

    .sidebar-item {
        display: block;
        color: #ecfdf5;
        padding: 12px 20px;
        text-decoration: none;
        font-weight: 600;
        border: none;                /* ← quita borde feo */
        outline: none;               /* ← quita borde de enfoque */
        background: transparent;
        border-left: 4px solid transparent;
        transition: 0.25s;
        border-radius: 4px;
        margin: 0 10px;
        width: calc(100% - 20px);
        text-align: left;
        cursor: pointer;
    }

    .sidebar-item:focus,
    .sidebar-item:active {
        border: none !important;     /* ← evita que aparezca en clic */
        outline: none !important;
        box-shadow: none !important; /* ← evita resplandores */
    }

    .sidebar-item:hover {
        background: rgba(255, 255, 255, 0.08);
        border-left: 4px solid #95d5b2;
    }



    /* RESPONSIVE */
    @media(max-width:768px){
        .sidebar {
            position: relative;
            width: 100%;
            height: auto;
            flex-direction: row;
            padding-top: 0;
            overflow-x: auto;
        }

        .sidebar a {
            border-left: none;
            border-bottom: 2px solid transparent;
        }

        .sidebar a:hover {
            border-bottom: 2px solid #95d5b2;
        }

        header {
            left: 0;
        }

        .contenedor {
            margin-left: 0;
            margin-top: 130px;
        }

        footer {
            margin-left: 0;
        }
    }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <a href="{% url 'inicio' %}">Inicio</a>

    {% if user.is_superuser %}
        <a href="{% url 'docentes' %}">Docentes</a>
        <a href="{% url 'programas' %}">Programas</a>
        <a href="{% url 'semestres' %}">Semestres</a>
        <a href="{% url 'estadisticas' %}">Estadísticas</a>
    {% endif %}

    <a href="{% url 'asistencias' %}">Asistencias</a>

    <form action="{% url 'logout' %}" method="post" style="margin: 0; padding: 0;">
        {% csrf_token %}
        <button type="submit" class="sidebar-item">
            Cerrar sesión
        </button>
    </form>


</div>


<!-- HEADER -->
<header> Sistema de Asistencia Docente </header>

<!-- CONTENIDO -->
<div class="contenedor">
    {% block contenido %}{% endblock %}
</div>

<!-- FOOTER -->
<footer>Hecho por Jairo Varon y Jhon Escorcia · Uniguajira</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
